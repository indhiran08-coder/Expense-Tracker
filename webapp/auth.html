<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In – Expense Tracker 💰</title>
  <meta name="description" content="Sign in or create an account to manage your personal expenses."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:  #00c6ff;
      --accent2: #0072ff;
      --danger:  #ff5c7c;
      --success: #00e5a0;
      --text:    #e8edf5;
      --muted:   #8a9bb5;
      --border:  rgba(255,255,255,0.10);
      --card:    rgba(255,255,255,0.05);
      --radius:  16px;
      --t:       0.22s cubic-bezier(.4,0,.2,1);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a1628 0%, #0f2340 50%, #0d2b4e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
      overflow: hidden;
    }

    /* Animated background blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      animation: blob 8s ease-in-out infinite alternate;
    }
    body::before {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(0,114,255,0.12) 0%, transparent 70%);
      top: -150px; left: -150px;
    }
    body::after {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(0,198,255,0.08) 0%, transparent 70%);
      bottom: -100px; right: -100px;
      animation-delay: -4s;
    }
    @keyframes blob {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(30px,20px) scale(1.1); }
    }

    /* ---- CARD ---- */
    .auth-card {
      background: var(--card);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
      padding: 44px 40px 36px;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
      animation: cardIn 0.45s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(32px) scale(0.97); }
      to   { opacity:1; transform: translateY(0)    scale(1);    }
    }

    /* ---- LOGO ---- */
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-icon {
      font-size: 3rem;
      display: block;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 16px rgba(0,198,255,0.5));
      animation: floatIcon 3s ease-in-out infinite;
    }
    @keyframes floatIcon {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    .logo-title {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(90deg, #00c6ff, #0072ff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ---- TABS ---- */
    .tabs {
      display: flex;
      background: rgba(255,255,255,0.04);
      border-radius: 50px;
      padding: 3px;
      margin-bottom: 28px;
      border: 1px solid var(--border);
    }
    .tab {
      flex: 1;
      padding: 9px;
      text-align: center;
      border-radius: 50px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--muted);
      transition: var(--t);
      border: none;
      background: transparent;
      font-family: inherit;
    }
    .tab.active {
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      color: #fff;
      box-shadow: 0 4px 16px rgba(0,114,255,0.35);
    }

    /* ---- FORM ---- */
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 0.73rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 6px;
    }
    .input-wrap { position: relative; }
    .input-icon {
      position: absolute;
      left: 13px; top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      opacity: 0.55;
      pointer-events: none;
    }
    .form-group input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.92rem;
      padding: 11px 14px 11px 40px;
      transition: var(--t);
      outline: none;
    }
    .form-group input:focus {
      border-color: var(--accent);
      background: rgba(0,198,255,0.07);
      box-shadow: 0 0 0 3px rgba(0,198,255,0.12);
    }
    .form-group input::placeholder { color: rgba(255,255,255,0.2); }

    /* ---- SUBMIT BUTTON ---- */
    .btn-submit {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--t);
      box-shadow: 0 6px 24px rgba(0,114,255,0.35);
      letter-spacing: 0.01em;
    }
    .btn-submit:hover:not(:disabled) {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(0,198,255,0.4);
    }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* ---- DIVIDER ---- */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ---- GOOGLE BUTTON ---- */
    .btn-google {
      width: 100%;
      padding: 11px;
      border: 1.5px solid var(--border);
      border-radius: 50px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--t);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-google:hover {
      background: rgba(255,255,255,0.09);
      border-color: rgba(255,255,255,0.22);
      transform: translateY(-1px);
    }

    /* ---- ALERT ---- */
    .alert {
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
    }
    .alert.error   { background: rgba(255,92,124,0.14); border: 1px solid var(--danger);  color: var(--danger);  display: block; }
    .alert.success { background: rgba(0,229,160,0.14);  border: 1px solid var(--success); color: var(--success); display: block; }

    /* ---- FOOTER NOTE ---- */
    .footer-note {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 22px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="auth-card">

  <!-- Logo -->
  <div class="logo">
    <span class="logo-icon">💰</span>
    <div class="logo-title">Expense Tracker</div>
    <div class="logo-sub">Track your spending · Master your finances</div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" id="tabLogin"  onclick="switchTab('login')">Sign In</button>
    <button class="tab"        id="tabSignup" onclick="switchTab('signup')">Create Account</button>
  </div>

  <!-- Alert -->
  <div class="alert" id="alertBox"></div>

  <!-- Login Form -->
  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label>Email Address</label>
      <div class="input-wrap">
        <span class="input-icon">📧</span>
        <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email"/>
      </div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" id="loginPassword" placeholder="Your password" required autocomplete="current-password"/>
      </div>
    </div>
    <button type="submit" class="btn-submit" id="loginBtn">🚀 Sign In</button>
  </form>

  <!-- Signup Form -->
  <form id="signupForm" style="display:none" onsubmit="handleSignup(event)">
    <div class="form-group">
      <label>Full Name</label>
      <div class="input-wrap">
        <span class="input-icon">👤</span>
        <input type="text" id="signupName" placeholder="Your full name" required autocomplete="name"/>
      </div>
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <div class="input-wrap">
        <span class="input-icon">📧</span>
        <input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email"/>
      </div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" id="signupPassword" placeholder="Min. 6 characters" required minlength="6" autocomplete="new-password"/>
      </div>
    </div>
    <button type="submit" class="btn-submit" id="signupBtn">✨ Create Account</button>
  </form>

  <!-- Divider + Google -->
  <div class="divider">or continue with</div>
  <button class="btn-google" onclick="handleGoogle()">
    <svg width="18" height="18" viewBox="0 0 48 48">
      <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
      <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
      <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
      <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
    </svg>
    Continue with Google
  </button>

  <p class="footer-note">
    By signing in you agree to manage your finances responsibly 💸<br/>
    Your data is securely stored in Supabase.
  </p>
</div>

<script>
  const SUPABASE_URL = 'https://dwsddrfjybtcyxawqjty.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_ONfsyb4fKt87kZlaHMWXjA__actgifW';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  // Redirect if already logged in
  db.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'index.html';
  });

  function switchTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('loginForm').style.display  = isLogin ? 'block' : 'none';
    document.getElementById('signupForm').style.display = isLogin ? 'none'  : 'block';
    document.getElementById('tabLogin').classList.toggle('active',  isLogin);
    document.getElementById('tabSignup').classList.toggle('active', !isLogin);
    hideAlert();
  }

  function showAlert(msg, type = 'error') {
    const el = document.getElementById('alertBox');
    el.textContent = msg;
    el.className   = 'alert ' + type;
  }
  function hideAlert() {
    document.getElementById('alertBox').className = 'alert';
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn   = document.getElementById('loginBtn');
    const email = document.getElementById('loginEmail').value;
    const pass  = document.getElementById('loginPassword').value;
    btn.disabled = true; btn.textContent = '⏳ Signing in…';
    hideAlert();
    const { error } = await db.auth.signInWithPassword({ email, password: pass });
    if (error) {
      showAlert('❌ ' + error.message);
      btn.disabled = false; btn.textContent = '🚀 Sign In';
    } else {
      showAlert('✅ Welcome back! Redirecting…', 'success');
      setTimeout(() => window.location.href = 'index.html', 900);
    }
  }

  async function handleSignup(e) {
    e.preventDefault();
    const btn   = document.getElementById('signupBtn');
    const name  = document.getElementById('signupName').value;
    const email = document.getElementById('signupEmail').value;
    const pass  = document.getElementById('signupPassword').value;
    btn.disabled = true; btn.textContent = '⏳ Creating account…';
    hideAlert();
    const { error } = await db.auth.signUp({
      email, password: pass,
      options: { data: { full_name: name } }
    });
    if (error) {
      showAlert('❌ ' + error.message);
      btn.disabled = false; btn.textContent = '✨ Create Account';
    } else {
      showAlert('✅ Account created! Check your email to confirm, then sign in.', 'success');
      btn.textContent = '✅ Done';
    }
  }

  async function handleGoogle() {
    const { error } = await db.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/index.html' }
    });
    if (error) showAlert('❌ ' + error.message);
  }
</script>
</body>
</html>
